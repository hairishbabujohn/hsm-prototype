model:
  d_model: 64
  n_layers: 2
  vocab_size: 32
  max_seq_len: 512
  ssm_rank: 16
  conv_kernels: [3, 7, 15]
  n_classes: 2
training:
  batch_size: 16
  lr: 3.0e-4
  betas: [0.9, 0.98]
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 10000
  warmup_steps: 200
  log_every: 100
  eval_every: 500
  seed: 42
  amp: false
data:
  dataset: synthetic_bracket
  seq_len: 128
loss:
  tau: 0.6
  mu: 1.0
  lambda_: 1.0e-4
  g_min: 0.05
  nu: 1.0
