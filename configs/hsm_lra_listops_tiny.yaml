model:
  d_model: 128
  n_layers: 4
  vocab_size: 32
  max_seq_len: 2048
  ssm_rank: 32
  conv_kernels: [3, 7, 15]
  n_classes: 10
training:
  batch_size: 32
  lr: 3.0e-4
  betas: [0.9, 0.98]
  weight_decay: 0.01
  grad_clip: 1.0
  max_steps: 50000
  warmup_steps: 1000
  log_every: 100
  eval_every: 1000
  seed: 42
  amp: false
data:
  dataset: lra_listops
  seq_len: 2048
loss:
  tau: 0.6
  mu: 1.0
  lambda_: 1.0e-4
  g_min: 0.05
  nu: 1.0
