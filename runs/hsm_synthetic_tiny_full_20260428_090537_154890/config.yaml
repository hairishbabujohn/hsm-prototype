data:
  dataset: synthetic_bracket
  seq_len: 128
loss:
  g_min: 0.05
  lambda_: 0.0001
  mu: 1.0
  nu: 1.0
  tau: 0.6
model:
  conv_kernels:
  - 3
  - 7
  - 15
  d_model: 64
  max_seq_len: 512
  n_classes: 2
  n_layers: 2
  ssm_rank: 16
  vocab_size: 32
training:
  amp: false
  batch_size: 16
  betas:
  - 0.9
  - 0.98
  eval_every: 500
  grad_clip: 1.0
  log_every: 100
  lr: 0.0003
  max_steps: 100
  seed: 42
  warmup_steps: 200
  weight_decay: 0.01
